<script>
(function() {
  function setupCanvas(canvas) {
    var ctx = canvas.getContext('2d');
    function resize() {
      var rect = canvas.getBoundingClientRect();
      var ratio = window.devicePixelRatio || 1;
      canvas.width = rect.width * ratio;
      canvas.height = rect.height * ratio;
      ctx.scale(ratio, ratio);
      ctx.lineJoin = 'round';
      ctx.lineCap = 'round';
      ctx.lineWidth = 3;
      ctx.strokeStyle = '#2563eb';
    }
    resize();
    window.addEventListener('resize', resize);

    var drawing = false;
    var last = null;
    canvas._hasDrawing = false;

    function getPos(e) {
      var rect = canvas.getBoundingClientRect();
      var clientX = e.touches ? e.touches[0].clientX : e.clientX;
      var clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return { x: clientX - rect.left, y: clientY - rect.top };
    }
    function start(e) {
      e.preventDefault();
      drawing = true;
      last = getPos(e);
      canvas._hasDrawing = true;
    }
    function move(e) {
      if (!drawing) return;
      e.preventDefault();
      var pos = getPos(e);
      ctx.beginPath();
      ctx.moveTo(last.x, last.y);
      ctx.lineTo(pos.x, pos.y);
      ctx.stroke();
      last = pos;
    }
    function end() { drawing = false; }

    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
    canvas.addEventListener('touchstart', start, { passive: false });
    canvas.addEventListener('touchmove', move, { passive: false });
    canvas.addEventListener('touchend', end);
  }

  document.querySelectorAll('.draw-canvas').forEach(setupCanvas);

  document.querySelectorAll('.clear-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      var id = btn.getAttribute('data-clear');
      var canvas = document.querySelector('canvas[data-canvas="' + id + '"]');
      var ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      canvas._hasDrawing = false;
      var fb = document.querySelector('span[data-feedback="' + id + '"]');
      fb.textContent = '';
      canvas.classList.remove('opacity-60', 'pointer-events-none');
    });
  });

  document.getElementById('submit-btn').addEventListener('click', function() {
    var canvases = document.querySelectorAll('.draw-canvas');
    var allGood = true;
    canvases.forEach(function(canvas) {
      var id = canvas.getAttribute('data-canvas');
      var fb = document.querySelector('span[data-feedback="' + id + '"]');
      if (canvas._hasDrawing) {
        fb.textContent = 'âœ“ Answer submitted';
        fb.classList.add('text-emerald-600');
        fb.classList.remove('text-red-500');
      } else {
        fb.textContent = 'âœ— Please draw something before submitting';
        fb.classList.add('text-red-500');
        fb.classList.remove('text-emerald-600');
        allGood = false;
      }
    });

    var overall = document.getElementById('overall-feedback');
    if (allGood) {
      overall.textContent = 'Great work! Both drawings submitted.';
      overall.classList.add('text-emerald-600');
      overall.classList.remove('text-red-500');
    } else {
      overall.textContent = 'Please complete all drawings before submitting.';
      overall.classList.add('text-red-500');
      overall.classList.remove('text-emerald-600');
    }
  });
})();
</script>
